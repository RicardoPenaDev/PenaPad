[package]
name = "penapad"
version = "1.2.0"
description = "Editor de texto e código leve para macOS, Windows e Linux"
authors = ["Ricardo Pena"]
license = "MIT"
repository = "https://github.com/RicardoPenaDev/PenaPad"
edition = "2021"

[lib]
name = "penapad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri-plugin-updater = "2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
