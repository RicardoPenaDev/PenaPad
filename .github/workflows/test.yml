# Testes a cada envio e pull request: tipos, testes da interface (Vitest) e da parte nativa (cargo test)
# nos três sistemas.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Tipos e interface
        run: npm run build:web

      - name: Testes da interface
        run: npm test

      - name: Testes da parte nativa
        run: npm run test:rust

      - name: Testes da interface no navegador (Playwright)
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui

      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: relatorio-playwright
          path: playwright-report/
